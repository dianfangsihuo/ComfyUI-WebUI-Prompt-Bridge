name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install numpy pillow pyyaml
      - name: Compile Python
        run: python -m py_compile nodes.py tests/test_prompt_library.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          cp web/webui_prompt_bridge.js "$RUNNER_TEMP/webui_prompt_bridge.mjs"
          node --check "$RUNNER_TEMP/webui_prompt_bridge.mjs"
          node --check tools/verify_frontend_compat.mjs
          node --check tools/test_panel_mount_browser.mjs
          node --check tools/test_layout_browser.mjs
          node --check tools/test_favorite_chinese_ui.mjs
          node --check tools/test_community_integration_browser.mjs

      - name: Test widget batch updates
        run: node tools/test_widget_batch.mjs

      - name: Test prompt drag behavior and layout budget
        run: node tools/test_prompt_drag.mjs

      - name: Test prompt reorder input transaction
        run: node tools/test_prompt_input_transaction.mjs

      - name: Test panel mount failure and recovery
        run: node tools/test_panel_lifecycle.mjs

      - name: Test section layout budgets and native resize
        run: |
          node tools/test_layout_budget.mjs
          node tools/test_vue_shell.mjs

      - name: Test translation deadlines, retry policy and cooldown
        run: node tools/test_translation_timeout.mjs

      - name: Prepare focused browser fixtures
        run: |
          npm install --no-save --ignore-scripts playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Test contributor interaction fixes and favorite translation UI
        run: |
          node tools/test_prompt_chip_editor.mjs
          node tools/test_prompt_translation.mjs
          node tools/test_prompt_quick_delete.mjs
          node tools/test_favorite_chinese_ui.mjs
